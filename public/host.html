<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emoji Quiz — Host Screen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { max-width: 980px; margin: 0 auto; gap: 24px; }
  header { display: flex; align-items: baseline; justify-content: space-between; width: 100%; }
  #lobby { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  #qr-wrap { text-align: center; }
  #qr-wrap img { width: 220px; height: 220px; border-radius: 16px; }
  #join-url { font-size: 0.95rem; color: var(--muted); margin-top: 8px; word-break: break-all; }
  #players-count { font-size: 3rem; font-weight: 800; }
  #players-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; max-width: 420px; }
  .chip { background: var(--paper); border-radius: 100px; padding: 8px 16px; font-size: 0.9rem; }

  .q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #question-num, #reveal-num { color: var(--muted); font-weight: 600; }
  .emoji-clue { font-size: 3rem; margin: 10px 0 0; line-height: 1; }

  .timer {
    flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%;
    background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 800;
  }
  .timer.expired { background: var(--salmon-50); }

  .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
  @media (max-width: 700px) {
    .mc-grid { grid-template-columns: 1fr; }
    .chart-label { width: 110px; }
  }
  .mc-opt {
    border-radius: 16px; padding: 20px 22px; color: var(--paper);
    display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.1rem;
    position: relative;
  }
  .mc-opt .letter {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0;
  }
  .mc-opt.accent-0 { background: var(--salmon-50); }
  .mc-opt.accent-1 { background: var(--pistachio-60); }
  .mc-opt.accent-2 { background: var(--yellow-50); color: var(--ink); }
  .mc-opt.accent-2 .letter { background: rgba(14,14,14,0.12); }
  .mc-opt.accent-3 { background: var(--sand-50); }

  /* reveal: kahoot-style vote chart */
  .chart-row { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .chart-row:first-child { margin-top: 24px; }
  .chart-letter {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; color: var(--paper);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem;
  }
  .chart-row.accent-0 .chart-letter { background: var(--salmon-50); }
  .chart-row.accent-1 .chart-letter { background: var(--pistachio-60); }
  .chart-row.accent-2 .chart-letter { background: var(--yellow-50); color: var(--ink); }
  .chart-row.accent-3 .chart-letter { background: var(--sand-50); }
  .chart-label { width: 200px; flex-shrink: 0; font-weight: 700; }
  .chart-track { flex: 1; background: var(--paper); border-radius: 8px; height: 36px; overflow: hidden; }
  .chart-fill { height: 100%; border-radius: 8px; background: var(--muted); transition: width 0.4s ease; }
  .chart-row.correct .chart-fill { background: var(--pistachio-60); }
  .chart-count { width: 80px; flex-shrink: 0; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .chart-row.correct .chart-label::after {
    content: "✓"; margin-left: 6px; color: var(--pistachio-60); font-weight: 800;
  }

  .explain { margin-top: 20px; background: var(--paper); border-radius: 14px; padding: 16px 18px; font-size: 1rem; color: var(--body); line-height: 1.5; }
  .stat-row { display: flex; gap: 28px; margin-top: 18px; }
  .stat .num { font-size: 1.7rem; font-weight: 800; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  #leaderboard-list, #final-list { margin-top: 8px; }
  .board-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 14px;
    background: var(--paper); margin-top: 8px;
  }
  .board-row:first-child { margin-top: 0; }
  .board-row.top1 { background: var(--salmon-50); color: var(--paper); }
  .board-row.top2 { background: var(--pistachio-60); color: var(--paper); }
  .board-row.top3 { background: var(--sand-50); color: var(--paper); }
  .rank { font-weight: 800; font-size: 1.1rem; width: 24px; flex-shrink: 0; }
  .board-name { flex: 1; font-weight: 700; }
  .board-score { font-variant-numeric: tabular-nums; font-weight: 800; }
  .board-delta { font-size: 0.8rem; opacity: 0.85; width: 34px; text-align: right; flex-shrink: 0; }

  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
  .winner-banner { text-align: center; margin-bottom: 8px; }
  .winner-banner .trophy { font-size: 2.4rem; }
  .winner-banner .name { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Team Warm-Up</div>
      <h1>Emoji Quiz</h1>
    </div>
  </header>

  <section id="lobby" class="card">
    <div id="qr-wrap">
      <img id="qr-img" alt="QR code to join" class="hidden" />
      <div id="join-url"></div>
    </div>
    <div>
      <div class="eyebrow">Players joined</div>
      <div id="players-count">0</div>
      <div id="players-list"></div>
      <div class="actions" style="margin-top:24px;">
        <button class="btn" id="start-btn">Start Game</button>
      </div>
    </div>
  </section>

  <section id="question-screen" class="card hidden">
    <div class="q-header">
      <div>
        <div id="question-num" class="eyebrow"></div>
        <div class="emoji-clue" id="question-emoji"></div>
      </div>
      <div class="timer" id="timer">10</div>
    </div>
    <div id="options" class="mc-grid"></div>
    <div class="actions">
      <button class="btn secondary" id="next-btn">Skip ahead</button>
    </div>
  </section>

  <section id="reveal-screen" class="card hidden">
    <div id="reveal-num" class="eyebrow"></div>
    <div class="emoji-clue" id="reveal-emoji" style="font-size: 2rem;"></div>
    <div id="reveal-chart"></div>
    <div class="explain" id="reveal-explain"></div>
    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-correct">0/0</div><div class="label">Got it right</div></div>
      <div class="stat"><div class="num" id="stat-fastest">—</div><div class="label">Fastest correct</div></div>
    </div>
    <div class="actions">
      <button class="btn secondary" id="next-btn-2">Skip ahead</button>
    </div>
  </section>

  <section id="leaderboard-screen" class="card hidden">
    <div class="eyebrow">Leaderboard</div>
    <div id="leaderboard-list"></div>
    <div class="actions">
      <button class="btn secondary" id="next-btn-3">Skip ahead</button>
    </div>
  </section>

  <section id="final-screen" class="card hidden">
    <div class="winner-banner">
      <div class="trophy">🏆</div>
      <div class="eyebrow">Champion</div>
      <div class="name" id="winner-name"></div>
    </div>
    <div id="final-list"></div>
    <div class="actions">
      <button class="btn secondary" id="reset-btn">Play Again</button>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
