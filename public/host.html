<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Warm-Up — Host Screen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { max-width: 980px; margin: 0 auto; gap: 24px; }
  header { display: flex; align-items: baseline; justify-content: space-between; width: 100%; }
  #lobby { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  #qr-wrap { text-align: center; }
  #qr-wrap img { width: 220px; height: 220px; border-radius: 16px; }
  #join-url { font-size: 0.95rem; color: var(--muted); margin-top: 8px; word-break: break-all; }
  #players-count { font-size: 3rem; font-weight: 800; }
  #players-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; max-width: 420px; }
  .chip { background: var(--paper); border-radius: 100px; padding: 8px 16px; font-size: 0.9rem; }

  .q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  #question-num { color: var(--muted); font-weight: 600; }
  #question-text { font-size: 2.2rem; margin: 8px 0 0; }

  .timer {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
  }
  .timer.expired { background: var(--salmon-50); }

  .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 32px 0 28px; }
  .team-col { border-radius: 18px; padding: 28px 22px; text-align: center; }
  .team-col.accent-0 { background: var(--salmon-50); color: var(--paper); }
  .team-col.accent-1 { background: var(--pistachio-60); color: var(--paper); }
  .team-col.accent-2 { background: var(--yellow-50); color: var(--ink); }
  .team-col.accent-3 { background: var(--sand-50); color: var(--paper); }
  .team-label { font-weight: 700; font-size: 1.15rem; margin-bottom: 10px; }
  .team-pct { font-size: 3rem; font-weight: 800; line-height: 1; }
  .team-count { font-size: 0.85rem; opacity: 0.75; margin-top: 6px; }
  .team-names { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 1.3em; }
  .name-pill {
    background: var(--paper);
    color: var(--ink);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }

  .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 24px 0 8px; }
  .insight-card { border-radius: 18px; padding: 26px 24px; }
  .insight-card.accent-0 { background: var(--salmon-50); color: var(--paper); }
  .insight-card.accent-1 { background: var(--pistachio-60); color: var(--paper); }
  .insight-card.accent-2 { background: var(--yellow-50); color: var(--ink); }
  .insight-card.accent-3 { background: var(--sand-50); color: var(--paper); }
  .insight-emoji { font-size: 1.6rem; }
  .insight-label { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.75; margin-top: 10px; }
  .insight-headline { font-size: 1.5rem; font-weight: 800; margin-top: 6px; }
  .insight-body { font-size: 1rem; opacity: 0.9; margin-top: 6px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Team Warm-Up</div>
      <h1>This or That</h1>
    </div>
  </header>

  <section id="lobby" class="card">
    <div id="qr-wrap">
      <img id="qr-img" alt="QR code to join" class="hidden" />
      <div id="join-url"></div>
    </div>
    <div>
      <div class="eyebrow">Players joined</div>
      <div id="players-count">0</div>
      <div id="players-list"></div>
      <div class="actions" style="margin-top:24px;">
        <button class="btn" id="start-btn">Start Game</button>
      </div>
    </div>
  </section>

  <section id="question-screen" class="card hidden">
    <div class="q-header">
      <div>
        <div id="question-num" class="eyebrow"></div>
        <h2 id="question-text"></h2>
      </div>
      <div class="timer" id="timer">10</div>
    </div>
    <div id="teams" class="teams-grid"></div>
    <div class="actions">
      <button class="btn secondary" id="next-btn">Skip ahead</button>
    </div>
  </section>

  <section id="summary-screen" class="card hidden">
    <div class="eyebrow">Wrap-up</div>
    <h2 style="margin-bottom: 8px;">The tea, spilled</h2>
    <div id="insights" class="insights-grid"></div>
    <div class="actions">
      <button class="btn secondary" id="reset-btn">Play Again</button>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
